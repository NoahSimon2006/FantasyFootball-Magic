name: CI

# Runs the same checks as local development, on every push and pull request:
#   api: ruff (lint + format), mypy (strict), pytest against a real Postgres
#   web: prettier, eslint, tsc, vitest, production build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it made obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      # The tests run against a real Postgres, exactly like local development
      # (see api/tests/conftest.py, which creates its own fantasy_magic_test database).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fantasy
          POSTGRES_PASSWORD: fantasy
          POSTGRES_DB: fantasy_magic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantasy -d fantasy_magic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: api
          enable-cache: true
      - name: Install dependencies (exactly as locked in uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Type check
        run: uv run mypy app
      - name: Test
        run: uv run pytest -q

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (exactly as locked in package-lock.json)
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
